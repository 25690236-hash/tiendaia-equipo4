# TiendaIA - Laboratorio 5

# Configuración reutilizable de los microservicios
x-servicio: &servicio
  restart: unless-stopped
  build: &construir
    context: .
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 10s
    timeout: 2s
    retries: 5

services:
  # Bases de datos
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: tienda
      MYSQL_USER: tienda
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
    networks: [interna]

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20
    networks: [interna]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [interna]

  # Microservicios
  clientes:
    <<: *servicio
    build:
      <<: *construir
      args:
        SERVICIO: clientes
    environment:
      DATABASE_URL: mysql+pymysql://tienda:${MYSQL_PASSWORD}@mysql:3306/tienda
    depends_on:
      mysql:
        condition: service_healthy
    networks: [interna]

  productos:
    <<: *servicio
    build:
      <<: *construir
      args:
        SERVICIO: productos
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    networks: [interna]

  ventas:
    <<: *servicio
    build:
      <<: *construir
      args:
        SERVICIO: ventas
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: "${RABBITMQ_HOST:-rabbitmq}"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clientes:
        condition: service_healthy
      productos:
        condition: service_healthy
    networks: [interna]

  ia:
    <<: *servicio
    build:
      <<: *construir
      args:
        SERVICIO: ia_service
    environment:
      VENTAS_URL: http://ventas:8000
      MODELO_PATH: /modelos/modelo.joblib
      REDIS_HOST: redis
      RABBITMQ_HOST: "${RABBITMQ_HOST:-rabbitmq}"
    volumes:
      - modelos:/modelos
    depends_on:
      ventas:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [interna]

  # Worker de inferencia
  worker:
    <<: *servicio
    healthcheck:
      disable: true
    build:
      <<: *construir
      args:
        SERVICIO: ia_service
    command: python worker.py
    environment:
      MODELO_PATH: /modelos/modelo.joblib
      REDIS_HOST: redis
      RABBITMQ_HOST: "${RABBITMQ_HOST:-rabbitmq}"
      RETARDO_MS: "200"
    volumes:
      - modelos:/modelos
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [interna]

  ia_listener:
    <<: *servicio
    healthcheck:
      disable: true
    build:
      <<: *construir
      args:
        SERVICIO: ia_listener
    command: python listener.py
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: "${RABBITMQ_HOST:-rabbitmq}"
      IA_URL: http://ia:8000
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      ia:
        condition: service_healthy
    networks: [interna]

  gateway:
    <<: *servicio
    build:
      <<: *construir
      args:
        SERVICIO: gateway
    environment:
      CORS_ORIGINS: "*"
      IA_URL: ${IA_URL:-http://ia:8000}
    depends_on:
      clientes:
        condition: service_healthy
      productos:
        condition: service_healthy
      ventas:
        condition: service_healthy
      ia:
        condition: service_healthy
    networks: [publica, interna]

  # Página web y proxy perimetral
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - "./frontend:/usr/share/nginx/html:ro"
      - "./perimetro/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    ports:
      - "8081:80"
    networks: [publica]
    depends_on: [gateway]

  # RabbitMQ - Broker de mensajes
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10
    networks: [interna, gestion]

  # Microservicio de Notificaciones
  notificaciones:
    <<: *servicio
    build:
      <<: *construir
      args:
        SERVICIO: notificaciones
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: "${RABBITMQ_HOST:-rabbitmq}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [interna]

  # SeaweedFS y servicio de imágenes no estaban incluidos en el
  # docker-compose.yml original que compartiste.
  # Añádelos aquí con su configuración original y los cambios del Anexo A.8.

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  modelos:

networks:
  publica: {}
  interna:
    internal: true
  gestion: {}