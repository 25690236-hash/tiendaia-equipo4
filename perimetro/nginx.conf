# Proxy perimetral de TiendaIA (Laboratorio 5): único punto de entrada.
# Se monta en el contenedor "web" como /etc/nginx/conf.d/default.conf.
# Este archivo se incluye dentro del bloque http {} de Nginx.

# Límite de peticiones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;
server_tokens off;

server {
    listen 80;
    server_name _;

    # Tamaño máximo del cuerpo: 6 MB
    client_max_body_size 6m;

    # DNS interno de Docker
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8000;
    set $s3 http://seaweedfs:8333;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cliente web estático
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # API: reenviar al gateway y limitar peticiones
    location /api/ {
        limit_req zone=api burst=20;
        proxy_pass $gateway;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Estado de los servicios
    location = /health {
        proxy_pass $gateway;
        proxy_set_header Host $host;
    }

    # Descarga de imágenes mediante SeaweedFS
    location /tiendaia-imagenes/ {
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass $s3;
        proxy_set_header Host $http_host;
    }

    # Bloquear documentación de FastAPI
    location ~ ^/(docs|redoc|openapi\.json) {
        return 403;
    }

    # Bloquear archivos y carpetas ocultos
    location ~ /\. {
        deny all;
    }
}